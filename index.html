<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style/custom-reset.css" />
    <link rel="stylesheet" href="style/font.css" />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <main class="catalog catalog--font">
      <div class="container catalog__container">
        <h1 class="catalog__title heading">Выбери свой продукт</h1>
        <div class="catalog__button-panel button-panel">
          <button id="button-recolor-product">перекрасить карточку</button>
          <button id="button-recolor-product-all">
            перекрасить все карточки
          </button>
          <button id="button-google">google.com</button>
          <button id="button-inversion">кнопка меняет цвет</button>
        </div>
        <ul id="product-list" class="catalog__product-blog product-list"></ul>
      </div>
    </main>
    <template id="template_product-card">
      <li class="product-list__item product-card">
        <img class="product-card__img" src="" alt="" />
        <span class="product-card__for"></span>
        <h2 class="product-card__title"></h2>
        <p class="product-card__text js_text"></p>

        <span class="product-card__list-name">Состав:</span>
        <ul class="product-card__compound-list"></ul>
        <div class="product-card__footer">
          <b>Цена</b>
          <span class="product-card__price"></span>
        </div>
      </li>
      <footer></footer>
    </template>
    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script src="homework-9.js" type="module"></script>
    <script src="homework-10.js" type="module"></script>
  </body>
</html>
